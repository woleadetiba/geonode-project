# Paste into luc-nginx conf.d on the VPS (e.g. ~/luc-infra/nginx/conf.d/geonode.conf)
# Then publish 8443 on luc-nginx and reload.
#
# Replace ssl_certificate paths with the exact ones from your existing
# srv1993936.hstgr.cloud HTTPS server block if different.

server {
    listen 8443 ssl;
    http2 on;
    server_name srv1993936.hstgr.cloud;

    # Same certs as the existing :443 HTTPS server block
    ssl_certificate     /etc/letsencrypt/live/srv1993936.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1993936.hstgr.cloud/privkey.pem;

    client_max_body_size 2G;

    location / {
        proxy_pass http://nginx4geonode_project:80;
        proxy_http_version 1.1;
        # $http_host keeps :8443; $host strips it and GeoNode redirects to :443
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
